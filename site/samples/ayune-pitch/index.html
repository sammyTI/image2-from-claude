<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AYUNE | 販売店様向けご提案資料</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="deck" aria-label="AYUNE 販売店様向けご提案資料">
  <div class="stage" id="stage">
    <img id="slide-img" src="./assets/01-cover.png" alt="表紙: 30代からの肌、立て直す。AYUNE 販売店様向けご提案資料 2026">
  </div>

  <div class="hud" aria-hidden="false">
    <button id="prev" class="nav nav-prev" aria-label="前のスライド">‹</button>
    <button id="next" class="nav nav-next" aria-label="次のスライド">›</button>
    <div class="counter"><span id="counter-current">1</span> / <span id="counter-total">10</span></div>
    <div class="hint">← → でページ送り ・ G でサムネ ・ F でフルスクリーン ・ P で印刷</div>
  </div>

  <div id="grid" class="grid" hidden aria-label="サムネイル一覧"></div>
</main>

<script src="./script.js"></script>
</body>
</html>
