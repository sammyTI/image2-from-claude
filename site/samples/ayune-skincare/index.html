<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AYUNE | 7日間トライアル</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="lp-shell" aria-label="AYUNE cosmetics trial landing page">
      <section class="slice slice-clickable" aria-label="AYUNE ファーストビュー">
        <img src="./assets/01-fv.png" alt="AYUNE 新発売。30代からの肌、立て直す。無料サンプルを請求する">
        <a class="image-cta image-cta-fv" href="#sample-form" aria-label="無料サンプルを請求する"></a>
      </section>

      <section class="slice">
        <img src="./assets/02-proof.png" alt="数字が選ばれる理由。モニター満足度97パーセント、星4.8">
      </section>

      <section class="slice">
        <img src="./assets/03-benefit.png" alt="3つの力で攻める。うるおい、ハリ、透明感の3イン1アプローチ">
      </section>

      <section class="slice">
        <img src="./assets/04-target.png" alt="こんな方へ。その悩み、本気で終わらせる。肌悩みチェックリスト">
      </section>

      <section class="slice">
        <img src="./assets/05-flow.png" alt="夜のたった4ステップ。洗顔、セラム、顔全体、クリーム">
      </section>

      <section class="slice">
        <img src="./assets/06-ingredient.png" alt="妥協なきこだわり。無香料、無着色、パラベンフリーなど7つの表示">
      </section>

      <section class="slice slice-clickable" aria-label="AYUNE 最終CTA">
        <img src="./assets/07-cta.png" alt="期間限定。今夜からはじめる。通常4800円が0円、無料サンプルを請求する">
        <a class="image-cta image-cta-final" href="#sample-form" aria-label="無料サンプルを請求する"></a>
      </section>

      <section id="sample-form" class="sample-form" aria-labelledby="form-title">
        <p class="form-kicker">＼ 期間限定・先着500名様 ／</p>
        <h1 id="form-title">無料サンプルを請求する</h1>
        <p class="form-copy">30代からのリニューイング セラムを、7日間トライアルでお試しいただけます。</p>
        <form>
          <label for="email">メールアドレス</label>
          <div class="form-row">
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            <button type="submit">送信</button>
          </div>
        </form>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
